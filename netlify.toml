# Netlify Configuration for F1IA
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # No build command needed - it's static HTML/CSS/JS
  command = ""
  # Publish the root directory (all files are here)
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    # Security headers
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    
# Cache static assets
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SPA redirect (not needed but good to have)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
